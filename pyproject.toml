[build-system]
requires = [
    "setuptools>=77.0.3,<80.0.0",
    "setuptools-scm>=8.0",
    "wheel",
]

build-backend = "setuptools.build_meta"

[project]
name = "vllm-qaic"
description = "QAIC plugin package for vLLM"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Qualcomm Data Center, LLM Serving Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Development/Unstable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence for Inference Accelerator",
]
requires-python = ">=3.10,<3.13"
dynamic = [ "version", "dependencies", "optional-dependencies", "entry-points"]

#[project.urls]
#Homepage="https://github.com/vllm-project/vllm"
#Documentation="https://docs.vllm.ai/en/latest/"
#Slack="https://slack.vllm.ai/"

[tool.setuptools_scm]
# no extra settings needed, presence enables setuptools-scm

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_qaic*"]
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.ruff.lint.per-file-ignores]
# Enforce G004 (no f-strings in logging) 
"test/*" = ["G004"]
"setup.py" = ["G004"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
    # flake8-logging-format
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
]

[tool.yapfignore]
ignore_patterns = [
    "build/**",
    "examples/**",
]

[tool.isort]
skip_glob = [
    "examples/*",
]
use_parentheses = true
skip_gitignore = true

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
follow_imports = "silent"

[tool.typos.files]
# these files may be written in non english words
extend-exclude = ["build/*", ".git/*"]
ignore-hidden = false

[tool.typos.default]
extend-ignore-identifiers-re = [".*[Uu][Ee][0-9][Mm][0-9].*"]

[tool.typos.default.extend-identifiers]
bbc5b7ede = "bbc5b7ede"
NOOPs = "NOOPs"
nin_shortcut = "nin_shortcut"
cudaDevAttrMaxSharedMemoryPerBlockOptin = "cudaDevAttrMaxSharedMemoryPerBlockOptin"
sharedMemPerBlockOptin = "sharedMemPerBlockOptin"

depthwise_seperable_out_channel = "depthwise_seperable_out_channel"
pard_token = "pard_token"
ptd_token_id = "ptd_token_id"
ser_de = "ser_de"
shared_memory_per_block_optin = "shared_memory_per_block_optin"
FoPE = "FoPE"
k_ot = "k_ot"
view_seperator = "view_seperator"
inverse_std_variences = "inverse_std_variences"

# Proper noun (contributor surname), not a typo for "Signal".
Singal = "Singal"

[tool.typos.default.extend-words]
iy = "iy"
indx = "indx"
# intel cpu features
tme = "tme"
dout = "dout"
Pn = "Pn"
arange = "arange"
# `thw` is a valid tensor axis order (Temporal, Height, Width) used by
# vision-language models (e.g. `image_grid_thw` in Qwen-VL), not a typo.
thw = "thw"
subtile = "subtile"
HSA = "HSA"
setp = "setp"
CPY = "CPY"
thr = "thr"
Thr = "Thr"
PARD = "PARD"
pard = "pard"
AKS = "AKS"
ba = "ba"
fo = "fo"
nd = "nd"
eles = "eles"
datas = "datas"
ser = "ser"
ure = "ure"
VALU = "VALU"
# Walsh-Hadamard Transform
wht = "wht"
WHT = "WHT"
# Huawei Compute Architecture for Neural Networks
CANN = "CANN"
# `vor` appears in HVX intrinsic names (e.g. `Q6_V_vor_VV`), not a typo for "for".
vor = "vor"

[tool.uv]
## Never install torch, so that no dependencies can override it.
## This requires that torch is installed separately in the target environment.
override-dependencies = [
    "torch; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
]

[tool.uv.sources]
vllm = { git = "https://github.com/vllm-project/vllm", rev = "v0.23.0" }

[tool.pytest.ini_options]
markers = [
    "qaic_test_config(**kwargs): per-test/module QAIC run configuration overrides",
    "qaic_aot_mode: test requires QAIC AOT (ahead-of-time compiled) mode to be installed",
    "qaic_disagg_installed: test requires the qaic_disagg package to be installed",
]
