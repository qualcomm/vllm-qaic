[pytest]
# ---------------------------------------------------------------------------
# vllm-qaic plugin — pure unit tests
# ---------------------------------------------------------------------------
# These tests require no QAIC hardware, no model loading, and no network.
# They run on any CPU-only host and complete in seconds.
#
# Run all unit tests:
#   pytest tests/test_qaic/unit_tests/ -v
#
# Run in parallel (requires pytest-xdist):
#   pytest tests/test_qaic/unit_tests/ -v -n auto
#
# Run only a specific module:
#   pytest tests/test_qaic/unit_tests/test_qaic_utils.py -v
# ---------------------------------------------------------------------------

addopts = -ra

markers =
    skip_global_cleanup: skip the global torch/distributed cleanup fixture

# Minimum pytest version required.
minversion = 7.0

# Test discovery: only collect files matching test_*.py inside this directory.
testpaths = .

# Dead test files that reference a nonexistent llm/embed_llm fixture live in
# tests/_deprecated/ (a sibling of unit/, outside this directory's tree
# entirely) so run_all_tests.sh's own find-based discovery never touches them.

# Show the 10 slowest tests at the end of each run.
# (Uncomment if pytest-durations is installed.)
# addopts = --durations=10
